ros_can_bridge:
  ros__parameters:
    can_channel: can0
    control_rate_hz: 50.0
    cmd_vel_timeout_s: 0.5
    board_timeout_s: 0.5
    wheelbase_m: 1.65
    max_speed_mps: 5.0
    max_steering_deg: 50.0
    min_speed_for_steering_mps: 0.1

steering_node:
  ros__parameters:
    can_channel: can0
    motor_id: 1
    tx_rate_hz: 20.0
    cmd_timeout_s: 0.5
    max_steering_deg: 50.0
    counts_per_deg_pos: 180.0
    counts_per_deg_neg: 320.0
    enable_period_s: 1.0
    safe_steering_deg: 0.0
    disable_on_fault: false
